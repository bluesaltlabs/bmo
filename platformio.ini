[platformio]
default_envs = waveshare_esp32_c6_lcd_147_4mb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  moononournation/GFX Library for Arduino@^1.5.9
monitor_filters = time, esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBMO_PIN_BOOT=9
  -DBMO_PIN_LCD_MOSI=6
  -DBMO_PIN_LCD_SCLK=7
  -DBMO_PIN_LCD_CS=14
  -DBMO_PIN_LCD_DC=15
  -DBMO_PIN_LCD_RST=21
  -DBMO_PIN_LCD_BL=22
  -DBMO_LCD_WIDTH=172
  -DBMO_LCD_HEIGHT=320
  -DBMO_LCD_COL_OFFSET=34
  -DBMO_LCD_ROW_OFFSET=0
  -DBMO_LCD_ROTATION=1
  -DBMO_LCD_IPS=1

[env:waveshare_esp32_c6_lcd_147_4mb]
board = esp32-c6-devkitm-1

[env:waveshare_esp32_c6_touch_lcd_147_8mb]
board = esp32-c6-devkitc-1
