[platformio]
default_envs = waveshare_esp32_c6_lcd_147_4mb

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  moononournation/GFX Library for Arduino@^1.5.9
monitor_filters = time, esp32_exception_decoder
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBMO_PIN_BOOT=9
  -DBMO_PIN_LCD_MOSI=6
  -DBMO_PIN_LCD_SCLK=7
  -DBMO_PIN_LCD_CS=14
  -DBMO_PIN_LCD_DC=15
  -DBMO_PIN_LCD_RST=21
  -DBMO_PIN_LCD_BL=22
  -DBMO_LCD_WIDTH=172
  -DBMO_LCD_HEIGHT=320
  -DBMO_LCD_COL_OFFSET=34
  -DBMO_LCD_ROW_OFFSET=0
  -DBMO_LCD_ROTATION=1
  -DBMO_LCD_IPS=1

[env:waveshare_esp32_c6_lcd_147_4mb]
board = esp32-c6-devkitm-1

[env:waveshare_esp32_c6_touch_lcd_147_8mb]
board = esp32-c6-devkitc-1

; Phase 2 audio-board stand-in (ESP32-WROOM-32). Overrides the display-only libs/flags.
[env:audio_esp32_wroom]
board = esp32dev
build_src_filter = -<*> +<../audio_src/>
lib_deps =
build_flags =
  -DBMO_PIN_LINK_RX=16
  -DBMO_PIN_LINK_TX=17
  -DBMO_PIN_BUTTON=0
monitor_filters = time

; Phase 3 voice bring-up: speaks serial-typed lines through an I2S DAC. Pins are placeholders until the audio hardware is chosen.
[env:voice_esp32_wroom]
board = esp32dev
build_src_filter = -<*> +<../voice_src/>
lib_deps =
build_flags =
  -DBMO_PIN_I2S_BCLK=26
  -DBMO_PIN_I2S_LRC=25
  -DBMO_PIN_I2S_DOUT=22
monitor_filters = time
